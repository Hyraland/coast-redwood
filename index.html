<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coast Redwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@1,300;1,400&display=swap">
<style>
  :root {
    color-scheme: dark;
    --ink: #0c1215;
    --fog: #c9d2d4;
    --fog-dim: rgba(201, 210, 212, 0.62);
    --fog-faint: rgba(201, 210, 212, 0.18);
    --ember: #e8a468;
    --serif: "Spectral", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--fog); overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .hud {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 48px 16px calc(20px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between;
    background: linear-gradient(to top, rgba(8, 12, 14, 0.62), rgba(8, 12, 14, 0));
    transition: opacity 0.9s ease;
  }
  .hud.idle { opacity: 0; }
  .hud.idle * { pointer-events: none; }
  .plate { display: grid; gap: 6px; max-width: 100%; }
  .plate h1 {
    margin: 0; font-family: var(--serif); font-style: italic; font-weight: 300;
    font-size: clamp(22px, 3.2vw, 34px); line-height: 1.05; letter-spacing: 0.005em; text-wrap: balance;
  }
  .readout {
    margin: 0; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fog-dim); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 14px;
  }
  .readout em { font-style: normal; color: var(--ember); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; justify-content: flex-end; margin-left: auto; }
  #rd-sun { min-width: 21ch; }
  #rd-elev { min-width: 10ch; }
  .controls button {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fog); background: rgba(12, 18, 21, 0.35); border: 1px solid var(--fog-faint);
    padding: 7px 11px; border-radius: 2px; cursor: pointer; min-width: 40px;
  }
  .controls button:hover { border-color: var(--fog-dim); }
  .controls button[aria-pressed="true"] { color: var(--ember); border-color: rgba(232, 164, 104, 0.55); }
  .controls button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
  .slider {
    display: flex; align-items: center; gap: 8px; padding: 0 10px; min-height: 30px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--fog); background: rgba(12, 18, 21, 0.35); border: 1px solid var(--fog-faint); border-radius: 2px;
  }
  .slider input { width: 110px; max-width: 30vw; accent-color: var(--ember); margin: 0; }
  .slider input:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
  .slider output { min-width: 5ch; text-align: right; color: var(--fog-dim); font-variant-numeric: tabular-nums; }
  .progress { position: fixed; left: 0; right: 0; bottom: 0; height: 2px; background: var(--fog-faint); }
  .progress span { display: block; height: 100%; width: 0; background: var(--ember); opacity: 0.8; }

  #loading {
    position: fixed; inset: 0; display: grid; place-items: center; padding-inline: 16px;
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fog-dim);
    background: var(--ink); transition: opacity 1.2s ease; text-align: center;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<canvas id="view" aria-label="First-person walk along a looping road through a foggy coast redwood forest"></canvas>

<div class="hud" id="hud">
  <div class="plate">
    <h1>Coast Redwood</h1>
    <p class="readout" id="readout">
      <span><em>Sequoia sempervirens</em></span>
      <span id="rd-dist">0.000 / 0.000 km</span>
      <span id="rd-elev">elev 0 m</span>
      <span id="rd-sun">night &middot; moonlit</span>
    </p>
  </div>
  <div class="controls" role="group" aria-label="Playback">
    <button id="btn-play" type="button" aria-pressed="false">Pause</button>
    <button id="btn-s1" type="button" aria-pressed="true">1&times;</button>
    <button id="btn-s2" type="button" aria-pressed="false">2&times;</button>
    <button id="btn-s4" type="button" aria-pressed="false">4&times;</button>
    <label class="slider" for="time-of-day"><span>Time</span><input id="time-of-day" type="range" min="0" max="1439" step="1" value="171"><output id="time-out" for="time-of-day">02:51</output></label>
    <label class="slider" for="fog-level"><span>Fog</span><input id="fog-level" type="range" min="0" max="100" step="1" value="21"><output id="fog-out" for="fog-level">21%</output></label>
    <button id="btn-sound" type="button" aria-pressed="false">Sound off</button>
    <button id="btn-cat" type="button" aria-pressed="false" aria-label="Black cat companion">Cat</button>
    <button id="btn-jay" type="button" aria-pressed="false" aria-label="Steller's jay companion">Jay</button>
    <button id="btn-hide" type="button">Hide</button>
  </div>
</div>
<div class="progress" aria-hidden="true"><span id="prog"></span></div>
<div id="loading">Growing the grove&hellip;</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script src="assets/cat-model.js"></script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const loadingEl = document.getElementById('loading');

/* =========================================================================
   Constants
   ========================================================================= */
const ROAD_HALF = 3.5;            // 7 m wide two-lane road
const WALK_SPEED = 1.35;          // m/s
const EYE = 1.62;                 // eye height (m)
const LANE_OFFSET = 1.3;          // walk on the right lane
const WORLD = 270;                // forest extends ±WORLD m
const SUN_EL = THREE.MathUtils.degToRad(32);
const SUN_AZ = THREE.MathUtils.degToRad(-28);
const sunDir = new THREE.Vector3(Math.cos(SUN_EL) * Math.cos(SUN_AZ), Math.sin(SUN_EL), Math.cos(SUN_EL) * Math.sin(SUN_AZ)).normalize();
const keyDir = sunDir.clone();                    // direction of the key light: the sun by day, the moon by night
const MOON_DIR = new THREE.Vector3(-0.35, 0.8, 0.45).normalize();

const SUN_COL = [1.0, 0.58, 0.29];
const FOG_AMB = [0.22, 0.30, 0.40];
const FOG_SUN = [1.0, 0.60, 0.32];
const FOG_A = 0.016;              // fog extinction at y = 0 (1/m)
const FOG_B = 1 / 55;             // height falloff

/* =========================================================================
   Utilities: RNG, noise
   ========================================================================= */
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash3i(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash3i(ix, iy, s), b = hash3i(ix + 1, iy, s), c = hash3i(ix, iy + 1, s), d = hash3i(ix + 1, iy + 1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
function fbm(x, y, oct = 4, s = 0) {
  let v = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { v += a * vnoise(x * f, y * f, s + i * 17); n += a; a *= 0.5; f *= 2.03; }
  return v / n;
}
// periodic 2D value noise (lattice wraps at px, py) for tileable textures
function pnoise(x, y, px, py, s = 0) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const x0 = ((ix % px) + px) % px, x1 = (x0 + 1) % px, y0 = ((iy % py) + py) % py, y1 = (y0 + 1) % py;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash3i(x0, y0, s), b = hash3i(x1, y0, s), c = hash3i(x0, y1, s), d = hash3i(x1, y1, s);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
const canvas2d = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const f3 = (v) => v.map(x => x.toFixed(5)).join(', ');

/* =========================================================================
   Renderer
   ========================================================================= */
const canvas = document.getElementById('view');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  loadingEl.textContent = 'This walk needs WebGL 2. Try a current version of Chrome, Edge, Firefox or Safari.';
  throw e;
}
const PR_MAX = Math.min(window.devicePixelRatio || 1, 1.5);
let pixelRatio = PR_MAX;
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

/* =========================================================================
   Custom height fog, injected into every built-in material.
   Blue ambient fog everywhere; sun-lit scattering comes from the volumetric pass.
   ========================================================================= */
const FOG_GLSL = /* glsl */`
uniform vec3 uSunDir; uniform vec3 uSunCol; uniform vec3 uFogAmb; uniform vec3 uFogSunC; uniform vec3 uGlowDir;
uniform vec3 uFogHigh; uniform vec3 uFogGlow;
#define SUN_DIR uSunDir
#define SUN_COL uSunCol
#define FOG_AMB uFogAmb
#define FOG_SUNC uFogSunC
#define FOG_B ${FOG_B.toFixed(5)}
vec3 fogColorDir(vec3 rd) {
  float mu0 = dot(rd, uGlowDir), mu = max(mu0, 0.0);
  float up = clamp(rd.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 c = mix(FOG_AMB, uFogHigh, smoothstep(0.5, 1.0, up) * 0.8 + 0.2 * (1.0 - mu)) * (0.62 + 0.75 * up * up);
  c += FOG_SUNC * (0.08 * pow(mu, 3.0) + 0.22 * pow(mu, 24.0));
  c += uFogGlow * pow(mu0 * 0.5 + 0.5, 4.0) * (1.2 - 0.6 * up);   // luminous haze on the sun's side
  return c;
}
float fogAmount(vec3 ro, vec3 rd, float dist) {
  float a = FOG_A * exp(-FOG_B * ro.y);
  float k = FOG_B * rd.y;
  float f = abs(k) > 1e-4 ? (1.0 - exp(-k * dist)) / k : dist;
  return 1.0 - exp(-a * f);
}
`;
// shared atmosphere uniforms, updated by the time-of-day control
const atmo = {
  uSunDir: { value: keyDir },
  uSunCol: { value: new THREE.Color(...SUN_COL) },   // key light colour scaled by its strength
  uFogAmb: { value: new THREE.Color(...FOG_AMB) },
  uFogSunC: { value: new THREE.Color(...FOG_SUN) },
  uGlowDir: { value: sunDir },
  uFogHigh: { value: new THREE.Color(...FOG_AMB) },
  uFogGlow: { value: new THREE.Color(0, 0, 0) },
};
// give every built-in material (they use the fog chunks above) access to those uniforms
function patchAtmo(root) {
  root.traverse((o) => {
    for (const m of [].concat(o.material || [])) {
      if (!m.fog || m.isShaderMaterial || m.userData.atmo) continue;
      m.userData.atmo = true;
      m.onBeforeCompile = (sh) => Object.assign(sh.uniforms, atmo);
    }
  });
}
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying vec3 vFogWorldPos;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
  vec4 fogWp = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    fogWp = instanceMatrix * fogWp;
  #endif
  vFogWorldPos = (modelMatrix * fogWp).xyz;
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
varying vec3 vFogWorldPos;
uniform float fogDensity;
#define FOG_A fogDensity
${FOG_GLSL}
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
  vec3 fogV = vFogWorldPos - cameraPosition;
  float fogD = length(fogV);
  vec3 fogRd = fogV / max(fogD, 1e-4);
  gl_FragColor.rgb = mix(gl_FragColor.rgb, fogColorDir(fogRd), fogAmount(cameraPosition, fogRd, fogD));
#endif`;

// Beyond the surface shadow map, treat the forest floor as mostly shaded (not fully sunlit).
THREE.ShaderChunk.shadowmap_pars_fragment = THREE.ShaderChunk.shadowmap_pars_fragment.replace(
  'float getShadow( sampler2D shadowMap, vec2 shadowMapSize, float shadowIntensity, float shadowBias, float shadowRadius, vec4 shadowCoord ) {\n\t\tfloat shadow = 1.0;',
  'float getShadow( sampler2D shadowMap, vec2 shadowMapSize, float shadowIntensity, float shadowBias, float shadowRadius, vec4 shadowCoord ) {\n\t\tfloat shadow = 0.22;');
if (!THREE.ShaderChunk.shadowmap_pars_fragment.includes('float shadow = 0.22;')) console.warn('shadow chunk patch did not apply');

/* =========================================================================
   Procedural textures
   ========================================================================= */
function makeBarkTextures() {
  const S = 512, h = new Float32Array(S * S);
  for (let y = 0; y < S; y++) {
    const v = y / S;
    const w = (pnoise(v * 2, 0.5, 2, 1, 3) - 0.5) * 0.02 + (pnoise(v * 9, 2.5, 9, 1, 4) - 0.5) * 0.008;
    for (let x = 0; x < S; x++) {
      const u = x / S + w;
      const r1 = pnoise(u * 34, v * 2, 34, 2, 7);
      const ridge = 1 - Math.abs(2 * r1 - 1);
      const r2 = pnoise(u * 90, v * 5, 90, 5, 8);
      const r3 = pnoise(u * 9, v * 9, 9, 9, 9);
      h[y * S + x] = 0.58 * Math.pow(ridge, 1.5) + 0.27 * r2 + 0.15 * r3;
    }
  }
  const cc = canvas2d(S, S), cn = canvas2d(S, S);
  const ic = cc.getContext('2d').createImageData(S, S), inn = cn.getContext('2d').createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const i = y * S + x, hv = h[i];
    const t = smooth(0.18, 0.78, hv);
    let r = lerp(38, 142, t), g = lerp(17, 70, t), b = lerp(11, 42, t);
    const gw = smooth(0.55, 0.85, pnoise(x / S * 5, y / S * 3, 5, 3, 11)) * t * 0.5;
    r = lerp(r, 132, gw); g = lerp(g, 110, gw); b = lerp(b, 98, gw);
    const j = (hash3i(x, y, 21) - 0.5) * 16;
    ic.data[i * 4] = clamp(r + j, 0, 255); ic.data[i * 4 + 1] = clamp(g + j * 0.6, 0, 255); ic.data[i * 4 + 2] = clamp(b + j * 0.4, 0, 255); ic.data[i * 4 + 3] = 255;
    const dx = h[y * S + (x + 1) % S] - h[y * S + (x - 1 + S) % S];
    const dy = h[((y + 1) % S) * S + x] - h[((y - 1 + S) % S) * S + x];
    let nx = -dx * 7, ny = dy * 7, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    inn.data[i * 4] = (nx * 0.5 + 0.5) * 255; inn.data[i * 4 + 1] = (ny * 0.5 + 0.5) * 255; inn.data[i * 4 + 2] = (nz * 0.5 + 0.5) * 255; inn.data[i * 4 + 3] = 255;
  }
  cc.getContext('2d').putImageData(ic, 0, 0); cn.getContext('2d').putImageData(inn, 0, 0);
  const map = new THREE.CanvasTexture(cc); map.colorSpace = THREE.SRGBColorSpace;
  const nrm = new THREE.CanvasTexture(cn);
  for (const t of [map, nrm]) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = MAX_ANISO; }
  return { map, nrm };
}

// flat redwood spray: stem with two-ranked needles
function makeSprayTexture() {
  const S = 256, c = canvas2d(S, S), g = c.getContext('2d');
  const R = mulberry32(99);
  g.lineCap = 'round';
  const stem = (t) => [S * 0.5 + Math.sin(t * 2.4) * 10, S - 6 - t * (S - 16)];
  let tipGlow = 0;
  const needle = (x, y, ang, len) => {
    const l = 24 + R() * 14 + tipGlow * 12, hue = 80 + R() * 24, sat = 22 + R() * 12;
    g.strokeStyle = `hsl(${hue},${sat}%,${l}%)`;
    g.lineWidth = 2.6;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len); g.stroke();
  };
  // side branchlets
  for (let k = 0; k < 13; k++) {
    const t = 0.06 + k / 13 * 0.9, [sx, sy] = stem(t), side = k % 2 ? 1 : -1;
    const blen = (84 - t * 52) * (0.8 + R() * 0.3);
    const ang = -Math.PI / 2 + side * (0.95 - t * 0.2);
    const ex = sx + Math.cos(ang) * blen, ey = sy + Math.sin(ang) * blen;
    g.strokeStyle = 'hsl(30,30%,18%)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(sx, sy); g.lineTo(ex, ey); g.stroke();
    const n = Math.floor(blen / 4);
    for (let i = 1; i <= n; i++) {
      const q = i / n, px = sx + (ex - sx) * q, py = sy + (ey - sy) * q;
      tipGlow = q * q;
      const nl = (13 - q * 7) * (0.8 + R() * 0.4);
      needle(px, py, ang - 1.25, nl); needle(px, py, ang + 1.25, nl);
    }
  }
  // needles on the main stem
  for (let i = 0; i < 52; i++) {
    const t = i / 52, [x, y] = stem(t);
    tipGlow = t * t;
    const nl = 12 - t * 5;
    needle(x, y, -Math.PI / 2 - 1.3, nl); needle(x, y, -Math.PI / 2 + 1.3, nl);
  }
  g.strokeStyle = 'hsl(28,32%,20%)'; g.lineWidth = 3;
  g.beginPath(); for (let i = 0; i <= 20; i++) { const [x, y] = stem(i / 20); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = MAX_ANISO;
  return tex;
}

// broadleaf sprig (tanoak / evergreen huckleberry): stem with alternating glossy leaves
function makeLeafTexture() {
  const S = 256, c = canvas2d(S, S), g = c.getContext('2d');
  const R = mulberry32(31);
  const leaf = (x, y, ang, len, wid) => {
    const l = 22 + R() * 18, hue = 88 + R() * 30;
    g.save(); g.translate(x, y); g.rotate(ang);
    g.fillStyle = `hsl(${hue},${26 + R() * 12}%,${l}%)`;
    g.beginPath(); g.moveTo(0, 0);
    g.quadraticCurveTo(wid, -len * 0.45, 0, -len); g.quadraticCurveTo(-wid, -len * 0.45, 0, 0); g.fill();
    g.strokeStyle = `hsla(${hue},40%,${l + 14}%,0.7)`; g.lineWidth = 1.2;
    g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -len * 0.9); g.stroke();
    g.restore();
  };
  for (let b = 0; b < 3; b++) {
    const bx = S * (0.3 + b * 0.2), tilt = (b - 1) * 0.35;
    g.strokeStyle = 'hsl(30,25%,22%)'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(S / 2, S - 4); g.lineTo(bx + Math.sin(tilt) * 60, 20); g.stroke();
    for (let i = 0; i < 11; i++) {
      const t = 0.12 + i / 11 * 0.85, x = lerp(S / 2, bx + Math.sin(tilt) * 60, t), y = lerp(S - 4, 20, t);
      const side = i % 2 ? 1 : -1;
      leaf(x, y, tilt + side * (0.9 + R() * 0.3), 34 + R() * 16, 11 + R() * 4);
    }
    leaf(bx + Math.sin(tilt) * 60, 22, tilt, 36, 11);
  }
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = MAX_ANISO;
  return tex;
}

// patch of redwood sorrel (Oxalis oregana): clusters of three heart-shaped leaflets
function makeSorrelTexture() {
  const S = 256, c = canvas2d(S, S), g = c.getContext('2d');
  const R = mulberry32(55);
  for (let k = 0; k < 70; k++) {
    const a = R() * Math.PI * 2, rr = Math.sqrt(R()) * 108, x = S / 2 + Math.cos(a) * rr, y = S / 2 + Math.sin(a) * rr;
    const sz = 9 + R() * 8, rot = R() * 6.28, hue = 86 + R() * 20, l = 30 + R() * 16;
    for (let j = 0; j < 3; j++) {
      const la = rot + j * 2.094;
      g.save(); g.translate(x, y); g.rotate(la);
      g.fillStyle = `hsl(${hue},${28 + R() * 10}%,${l + R() * 5}%)`;
      g.beginPath(); g.arc(-sz * 0.3, -sz * 0.75, sz * 0.42, 0, Math.PI * 2); g.arc(sz * 0.3, -sz * 0.75, sz * 0.42, 0, Math.PI * 2);

}

// Low-poly animated cat by Quaternius (Animal Pack Vol.2, CC0), embedded by assets/cat-model.js.
// If it is missing or fails to load, the hand-built cat above is used instead.
let catGltf = null;
if (window.CAT_GLB_BASE64) {
  try {
    const bin = Uint8Array.from(atob(window.CAT_GLB_BASE64), (c) => c.charCodeAt(0));
    new GLTFLoader().parse(bin.buffer, '', (g) => { catGltf = g; }, (e) => console.warn('Cat model failed to load; using the built-in cat.', e));
  } catch (e) { console.warn('Cat model failed to decode; using the built-in cat.', e); }
}

function makeGltfCat(gltf) {
  const fur = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.009, 0.009, 0.011), roughness: 0.62, flatShading: true });
  const skin = new THREE.MeshStandardMaterial({ color: new THREE.Color(0.075, 0.04, 0.045), roughness: 0.7, flatShading: true });
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x9ab83a, emissive: new THREE.Color(0.45, 0.6, 0.12), emissiveIntensity: 0.9, roughness: 0.15 });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x020202, roughness: 0.1 });
  const model = gltf.scene;
  model.traverse((o) => {
    if (!o.isMesh) return;
    const pick = (m) => (m.name === 'Pink' ? skin : fur);               // grey and white patches both become black fur
    o.material = Array.isArray(o.material) ? o.material.map(pick) : pick(o.material);
    o.castShadow = true; o.frustumCulled = false;
  });

  const holder = new THREE.Group(); holder.rotation.y = -Math.PI / 2; holder.scale.setScalar(0.1);
  model.position.x = 0.35; holder.add(model);
  const root = new THREE.Group(); root.add(holder);
  const bone = (n) => model.getObjectByName(n) || model.getObjectByName(n.replace('.', ''));
  const neck = bone('Bone.002'), head = bone('Bone.003');
  // glowing almond eyes with slit pupils, placed on the face and parented to the head bone
  root.updateMatrixWorld(true);
  const ball = new THREE.SphereGeometry(1, 16, 12);
  for (const sz of [-1, 1]) {
    const eye = new THREE.Mesh(ball, eyeMat); eye.position.set(2.9, 2.86, sz * 0.2); eye.scale.set(0.04, 0.085, 0.115); eye.rotation.y = sz * 0.5;
    const pupil = new THREE.Mesh(ball, pupilMat); pupil.position.set(2.935, 2.86, sz * 0.2); pupil.scale.set(0.02, 0.078, 0.022); pupil.rotation.y = sz * 0.5;

  }

  const clip = (n) => gltf.animations.find((a) => a.name === n);

  walk.play(); idle.play();
  const WALK_RATE = 3.6;               // the clip takes short steps; played brisker it reads as a trot at her pace
  const pq = new THREE.Quaternion(), qd = new THREE.Quaternion(), axis = new THREE.Vector3();
  const turnBone = (b, angle) => {     // rotate a bone about world-up, expressed in its parent's frame
    if (!b) return;

    axis.set(0, 1, 0).applyQuaternion(pq.invert());
    b.quaternion.premultiply(qd.setFromAxisAngle(axis, angle));
    b.updateMatrixWorld(true);
  };

  return {
    root,
    spawn() { st.s = dist + 5; st.waiting = false; st.stop = 0; st.yaw = roadYaw(st.s); },
    update(dtG, dtR, cam) {
      st.t += dtR;
      let gap = aheadOf(st.s);
      if (gap < 1.6) { st.s = dist + 1.6; gap = 1.6; st.waiting = false; }   // never let you walk through her
      if (st.waiting) { if (gap < 3.2) st.waiting = false; }
      else if (gap > st.wait) { st.waiting = true; st.wait = 5.5 + Math.random() * 3.5; }
      if (!st.waiting && st.stop < 0.4) st.s += WALK_SPEED * 1.3 * dtG;
      st.stop = clamp(st.stop + (st.waiting ? 1 : -1) * dtR * 2.5, 0, 1);
      const k = st.stop * st.stop * (3 - 2 * st.stop);
      st.lat = 0.7 + 0.55 * Math.sin(st.s * 0.11) + 0.3 * Math.sin(st.s * 0.37 + 1);
      surfaceAt(st.s, st.lat, root.position);
      const toCam = Math.atan2(cam.x - root.position.x, cam.z - root.position.z);
      const want = roadYaw(st.s) + 0.08 * Math.cos(st.s * 0.11) + (st.waiting ? 0.62 * angleDiff(toCam, roadYaw(st.s)) : 0);
      st.yaw += angleDiff(want, st.yaw) * Math.min(1, dtR * 3);
      root.rotation.y = st.yaw;

      // so an offset left in place would pile up frame after frame
      for (const [b, q] of animBase) b.quaternion.copy(q);
      mixer.update(dtR);
      for (const [b, q] of animBase) q.copy(b.quaternion);
      // while she waits, her head turns to look back at you
      root.updateMatrixWorld(true);
      const look = clamp(angleDiff(toCam, st.yaw), -1.2, 1.2) * k + 0.2 * Math.sin(st.t * 0.5) * (1 - k);
      turnBone(neck, look * 0.45); turnBone(head, look * 0.55);
    },
  };
}

let companion = null;

/* =========================================================================
   Forest soundscape, synthesised live with Web Audio (no recordings):

function createForestSound() {
  const AC = window.AudioContext || window.webkitAudioContext;

          b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;

    // crossfade the day and night layers over a few seconds (instantly when the sound is first switched on)
    setNight(v, immediate = false) {
      if (v === night && !immediate) return;
      night = v;
      const t = ctx.currentTime, tc = immediate ? 0.01 : 1.1;
      for (const [bus, on] of [[dayBus, !v], [nightBus, v]]) for (const g of [bus.d, bus.w]) {
        if (g.gain.cancelAndHoldAtTime) g.gain.cancelAndHoldAtTime(t); else g.gain.cancelScheduledValues(t);
        g.gain.setTargetAtTime(on ? 1 : 0, t, tc);
      }
    },
    // Steller's jay: a harsh, repeated "shook-shook-shook"
    jayCall(pan) {
      if (!running) return;
      const v = voice(clamp(pan, -0.9, 0.9), 0.5, 6000);
      const bp = filter('bandpass', 1700, 1.6); bp.connect(v.input);
      const n = 2 + Math.floor(rand() * 3);
      for (let i = 0; i < n; i++) {
        const t = ctx.currentTime + 0.05 + i * 0.2;
        const o = ctx.createOscillator(), am = gain(0.6), mod = ctx.createOscillator(), md = gain(0.4), e = gain(0);
        o.type = 'sawtooth'; o.frequency.setValueAtTime(1250, t); o.frequency.exponentialRampToValueAtTime(820, t + 0.13);
        mod.frequency.value = 42; mod.connect(md).connect(am.gain);
        o.connect(am).connect(e).connect(bp);
        e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(0.06, t + 0.015); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
        o.start(t); mod.start(t); o.stop(t + 0.17); mod.stop(t + 0.17);
        cleanup(o, i === n - 1 ? [o, mod, md, am, e, bp, ...v.nodes] : [o, mod, md, am, e]);
      }
    },
    start() {
      ctx.resume();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0.9, ctx.currentTime, 0.8);
      if (running) return;
      running = true;
      gust(); later(drip, 400);
      later(() => thrush(birds[0]), 1500); later(() => thrush(birds[1]), 9000);
      later(wren, 7000 + rand() * 10000); later(drum, 30000 + rand() * 30000);
      later(chirps, 300); later(spottedOwl, 4000 + rand() * 8000); later(screechOwl, 20000 + rand() * 30000);
    },
    stop() {
      running = false;
      for (const id of timers) clearTimeout(id);
      timers.clear();
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
      setTimeout(() => { if (!running) ctx.suspend(); }, 700);
    },
  };
}

/* =========================================================================
   HUD & loop
   ========================================================================= */
const hud = document.getElementById('hud');
const btnPlay = document.getElementById('btn-play');
const speedBtns = { 1: document.getElementById('btn-s1'), 2: document.getElementById('btn-s2'), 4: document.getElementById('btn-s4') };
const rdDist = document.getElementById('rd-dist'), rdElev = document.getElementById('rd-elev'), prog = document.getElementById('prog');
let playing = true, speed = 1, dist = 0, hidden = false, idleTimer = 0;

function setPlaying(p) { playing = p; btnPlay.textContent = p ? 'Pause' : 'Play'; btnPlay.setAttribute('aria-pressed', String(!p)); }
function setSpeed(s) { speed = s; for (const k in speedBtns) speedBtns[k].setAttribute('aria-pressed', String(+k === s)); }
function wake() {
  if (hidden) return;
  hud.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => hud.classList.add('idle'), 3500);
}
btnPlay.addEventListener('click', () => setPlaying(!playing));
for (const k in speedBtns) speedBtns[k].addEventListener('click', () => setSpeed(+k));
document.getElementById('btn-hide').addEventListener('click', () => { hidden = true; hud.classList.add('idle'); });
const fogInput = document.getElementById('fog-level'), fogOut = document.getElementById('fog-out');
let fogLevel = 1, nightK = 0;
function updateExposure() {
  compPass.uniforms.uExposure.value = EXPOSURE * (1 + 0.22 * (1 - fogLevel)) * timeExp;
}

const timeInput = document.getElementById('time-of-day'), timeOut = document.getElementById('time-out'), rdSun = document.getElementById('rd-sun');
const C = (r, g, b) => new THREE.Color(r, g, b);
const mixC = (a, b, t) => a.clone().lerp(b, clamp(t, 0, 1));
const PAL = {
  sunRise: C(1.0, 0.56, 0.20), sunSet: C(1.0, 0.38, 0.13), sunMorning: C(1.0, 0.60, 0.30), sunNoon: C(1.0, 0.84, 0.64), moon: C(0.55, 0.66, 1.0),
};
// Sky and light keyframes by sun altitude (deg). Morning and evening differ:
// dawn leans green-gold, sunset orange-pink, the evening blue hour pink-purple.
const NIGHT = { zen: [0.003, 0.007, 0.03], mid: [0.008, 0.016, 0.05], hor: [0.015, 0.03, 0.075], glow: [0, 0, 0], belt: [0, 0, 0],
  amb: [0.02, 0.034, 0.085], fogHigh: [0.02, 0.034, 0.085], fogGlow: [0, 0, 0], hemi: [0.22, 0.32, 0.78], hemiI: 0.55, gnd: [0.05, 0.06, 0.10], exp: 2.3, sat: 1 };
const DAY = { zen: [0.025, 0.12, 0.60], mid: [0.09, 0.27, 0.76], hor: [0.20, 0.40, 0.86], glow: [0.25, 0.2, 0.12], belt: [0, 0, 0],
  amb: [0.20, 0.30, 0.46], fogHigh: [0.20, 0.30, 0.46], fogGlow: [0, 0, 0], hemi: [0.52, 0.70, 1.25], hemiI: 1.6, gnd: [0.34, 0.28, 0.20], exp: 1, sat: 1 };
const EVENING = [
  { e: -12, ...NIGHT },
  { e: -7, zen: [0.08, 0.08, 0.26], mid: [0.30, 0.20, 0.46], hor: [0.70, 0.36, 0.50], glow: [0.5, 0.2, 0.3], belt: [0.2, 0.1, 0.25],       // blue hour: pink-purple
    amb: [0.20, 0.15, 0.34], fogHigh: [0.14, 0.12, 0.32], fogGlow: [0.25, 0.10, 0.15], hemi: [0.55, 0.42, 0.95], hemiI: 0.85, gnd: [0.10, 0.08, 0.14], exp: 1.85, sat: 1.2 },
  { e: -3, zen: [0.30, 0.22, 0.36], mid: [0.80, 0.45, 0.50], hor: [1.3, 0.60, 0.40], glow: [1.6, 0.7, 0.45], belt: [0.6, 0.35, 0.5],        // afterglow: peach-pink air, lavender sky
    amb: [0.55, 0.34, 0.40], fogHigh: [0.45, 0.34, 0.50], fogGlow: [0.9, 0.45, 0.30], hemi: [1.0, 0.66, 0.78], hemiI: 1.1, gnd: [0.25, 0.16, 0.16], exp: 1.45, sat: 1.25 },
  { e: 2, zen: [0.10, 0.08, 0.10], mid: [0.35, 0.20, 0.16], hor: [1.6, 0.50, 0.06], glow: [3.0, 1.1, 0.2], belt: [0.35, 0.2, 0.3],          // sunset: orange band under a mauve sky
    amb: [0.48, 0.26, 0.16], fogHigh: [0.30, 0.20, 0.24], fogGlow: [1.6, 0.6, 0.1], hemi: [1.0, 0.60, 0.45], hemiI: 1.2, gnd: [0.30, 0.18, 0.12], exp: 1.25, sat: 1.3 },
  { e: 10, zen: [0.05, 0.12, 0.42], mid: [0.25, 0.30, 0.55], hor: [1.0, 0.60, 0.30], glow: [1.4, 0.7, 0.25], belt: [0.1, 0.06, 0.08],       // golden hour
    amb: [0.34, 0.30, 0.34], fogHigh: [0.30, 0.30, 0.42], fogGlow: [0.7, 0.38, 0.12], hemi: [0.85, 0.75, 0.85], hemiI: 1.45, gnd: [0.32, 0.24, 0.18], exp: 1.08, sat: 1.12 },
  { e: 25, ...DAY },
];
const MORNING = [
  { e: -12, ...NIGHT },
  { e: -8, zen: [0.02, 0.04, 0.14], mid: [0.05, 0.10, 0.22], hor: [0.12, 0.16, 0.26], glow: [0.1, 0.1, 0.06], belt: [0.04, 0.05, 0.08],      // early blue hour
    amb: [0.06, 0.10, 0.16], fogHigh: [0.05, 0.09, 0.16], fogGlow: [0.05, 0.05, 0.03], hemi: [0.35, 0.50, 0.80], hemiI: 0.8, gnd: [0.07, 0.08, 0.12], exp: 1.9, sat: 1.1 },
  { e: -4, zen: [0.06, 0.09, 0.06], mid: [0.22, 0.30, 0.12], hor: [1.0, 0.55, 0.08], glow: [2.2, 1.2, 0.25], belt: [0.12, 0.14, 0.10],      // before sunrise: olive-teal over a gold band
    amb: [0.20, 0.28, 0.18], fogHigh: [0.16, 0.24, 0.18], fogGlow: [0.9, 0.55, 0.12], hemi: [0.55, 0.80, 0.55], hemiI: 1.0, gnd: [0.20, 0.18, 0.10], exp: 1.5, sat: 1.3 },
  { e: 1, zen: [0.12, 0.18, 0.14], mid: [0.45, 0.45, 0.20], hor: [1.4, 0.85, 0.25], glow: [3.0, 1.8, 0.5], belt: [0.2, 0.18, 0.14],         // sunrise: luminous golden haze
    amb: [0.40, 0.38, 0.20], fogHigh: [0.25, 0.32, 0.26], fogGlow: [1.6, 1.0, 0.3], hemi: [0.95, 0.88, 0.55], hemiI: 1.25, gnd: [0.28, 0.22, 0.14], exp: 1.25, sat: 1.25 },
  { e: 8, zen: [0.05, 0.15, 0.50], mid: [0.20, 0.35, 0.60], hor: [0.80, 0.70, 0.45], glow: [1.2, 0.8, 0.3], belt: [0.06, 0.05, 0.05],
    amb: [0.28, 0.32, 0.34], fogHigh: [0.22, 0.30, 0.40], fogGlow: [0.5, 0.32, 0.12], hemi: [0.70, 0.78, 0.95], hemiI: 1.45, gnd: [0.32, 0.26, 0.18], exp: 1.08, sat: 1.1 },
  { e: 25, ...DAY },
];
function sampleKeys(keys, e) {
  e = clamp(e, keys[0].e, keys[keys.length - 1].e);
  let i = 0; while (i < keys.length - 2 && e > keys[i + 1].e) i++;
  const a = keys[i], b = keys[i + 1], t = smooth(a.e, b.e, e), out = {};
  for (const k in a) out[k] = Array.isArray(a[k]) ? new THREE.Color(lerp(a[k][0], b[k][0], t), lerp(a[k][1], b[k][1], t), lerp(a[k][2], b[k][2], t)) : lerp(a[k], b[k], t);
  return out;
}
let timeExp = 1, glareStrength = 0, lastTimeMinutes = 171;
function applyTime(minutes) {
  lastTimeMinutes = minutes;
  const h = minutes / 60;
  const el = THREE.MathUtils.degToRad(62) * Math.sin(Math.PI * (h - 6) / 12);   // sun altitude, negative at night
  const az = SUN_AZ + (h - 8.1667) * Math.PI / 12;
  sunDir.set(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az)).normalize();
  const e = THREE.MathUtils.radToDeg(el), morning = h < 12;
  const P = sampleKeys(morning ? MORNING : EVENING, e);
  nightK = 1 - smooth(-14, -3, e);
  // key light: the sun above -3°, the moon below (both are dark at the hand-over)
  let keyCol, keyI;
  if (e > -3) {
    keyDir.copy(sunDir);
    keyCol = e < 20 ? mixC(morning ? PAL.sunRise : PAL.sunSet, PAL.sunMorning, (e - 2) / 18) : mixC(PAL.sunMorning, PAL.sunNoon, (e - 20) / 35);
    keyI = 6.5 * smooth(-2, 10, e);
  } else {
    keyDir.copy(MOON_DIR); keyCol = PAL.moon.clone(); keyI = 1.1 * nightK;
  }
  updateLightBasis();
  sun.color.copy(keyCol); sun.intensity = keyI;
  const twilight = 1 - smooth(10, 25, e);
  atmo.uSunCol.value.copy(keyCol).multiplyScalar(keyI / 6);
  atmo.uFogSunC.value.copy(keyCol).multiplyScalar(Math.min(1, keyI / 6) * 1.05).add(P.glow.clone().multiplyScalar(0.35 * twilight));
  atmo.uFogAmb.value.copy(P.amb);
  if (forestSound) forestSound.setNight(nightK > 0.5);          // fades between day and night sounds mid blue hour
  atmo.uFogHigh.value.copy(P.fogHigh); atmo.uFogGlow.value.copy(P.fogGlow);
  compPass.uniforms.uSat.value = P.sat;
  compPass.uniforms.uTwi.value = (1 - smooth(8, 25, e)) * smooth(-12, -6, e);
  glareStrength = smooth(-1.5, 2, e) * (1 - 0.6 * fogLevel) * (e < 30 ? 1 : 0.6);
  compPass.uniforms.uGlareCol.value.copy(keyCol).multiplyScalar(e < 20 ? 1.6 : 1.1);
  hemi.color.copy(P.hemi); hemi.groundColor.copy(P.gnd); hemi.intensity = P.hemiI;
  skyU.uNight.value = nightK;
  skyU.uSkyZen.value.copy(P.zen); skyU.uSkyMid.value.copy(P.mid); skyU.uSkyHor.value.copy(P.hor);
  skyU.uGlowCol.value.copy(P.glow); skyU.uBeltCol.value.copy(P.belt);
  skyU.uSunDisk.value.copy(keyCol).multiplyScalar(e > -3 ? 1 : 0);
  timeExp = P.exp;
  updateExposure();
  const hh = String(Math.floor(h) % 24).padStart(2, '0'), mm = String(Math.round(minutes % 60)).padStart(2, '0');
  timeInput.value = String(minutes);
  timeOut.textContent = `${hh}:${mm}`;
  const deg = `${Math.round(e)}\u00b0`;
  rdSun.textContent = e >= 10 ? `sun alt ${deg}` : e >= 1 ? `golden hour \u00b7 ${deg}` : e >= -1 ? (morning ? 'sunrise' : 'sunset')
    : e >= -5 ? (morning ? 'dawn' : 'afterglow') : e >= -11 ? 'blue hour' : 'night \u00b7 moonlit';
}
timeInput.addEventListener('input', () => {
  applyTime(+timeInput.value);
  try { localStorage.setItem('redwood-time', timeInput.value); } catch (e) { /* storage unavailable */ }
});
function setFog(pct) {
  fogLevel = clamp(pct, 0, 100) / 100;
  const eff = 0.06 + 0.94 * fogLevel;                     // a whisper of haze remains so distance still reads
  scene.fog.density = volShared.uFogA.value = FOG_A * eff;
  if (sky) sky.material.uniforms.uFogLevel.value = fogLevel;
  compPass.uniforms.uSkyClear.value = 1 - fogLevel;
  applyTime(lastTimeMinutes);                          // glare strength depends on fog
  fogInput.value = String(Math.round(fogLevel * 100));
  fogOut.textContent = `${Math.round(fogLevel * 100)}%`;
  if (forestSound) forestSound.setFog(fogLevel);
}
fogInput.addEventListener('input', () => {
  setFog(+fogInput.value);
  try { localStorage.setItem('redwood-fog', fogInput.value); } catch (e) { /* storage unavailable */ }
});

document.getElementById('btn-cat').addEventListener('click', () => setCompanion(companion === companions.cat ? null : 'cat'));
document.getElementById('btn-jay').addEventListener('click', () => setCompanion(companion === companions.jay ? null : 'jay'));
const btnSound = document.getElementById('btn-sound');
let forestSound = null, soundOn = false;
btnSound.addEventListener('click', () => {
  soundOn = !soundOn;
  btnSound.textContent = soundOn ? 'Sound on' : 'Sound off';
  btnSound.setAttribute('aria-pressed', String(soundOn));
  if (soundOn) {
    try { forestSound = forestSound || createForestSound(); forestSound.setFog(fogLevel); forestSound.setNight(nightK > 0.5, true); forestSound.start(); }
    catch (e) { soundOn = false; btnSound.textContent = 'Sound unavailable'; btnSound.disabled = true; }
  } else if (forestSound) forestSound.stop();
});
addEventListener('pointermove', wake);
addEventListener('pointerdown', () => { if (hidden) { hidden = false; } wake(); });
addEventListener('keydown', (ev) => {
  if (ev.code === 'Space' && ev.target === document.body) { ev.preventDefault(); setPlaying(!playing); }
  else if (ev.key === 'h' || ev.key === 'H') { hidden = !hidden; hidden ? hud.classList.add('idle') : wake(); }
  else if (ev.key === '1' || ev.key === '2' || ev.key === '4') setSpeed(+ev.key);
});

let last = performance.now(), hudTick = 0, frames = 0, frameAcc = 0, warm = 0;
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) dist = (dist + dt * WALK_SPEED * speed) % LOOP_LEN;
  if (companion) companion.update(playing ? dt * speed : 0, dt, camera.position);
  renderFrame(dist, now / 1000);

  // adaptive resolution
  warm += dt; frames++; frameAcc += dt;
  if (warm > 3 && frames >= 90) {
    const avg = frameAcc / frames;
    if (avg > 0.030 && pixelRatio > 0.55) { pixelRatio = Math.max(0.55, pixelRatio * 0.85); resize(); }
    else if (avg < 0.0135 && pixelRatio < PR_MAX) { pixelRatio = Math.min(PR_MAX, pixelRatio * 1.1); resize(); }
    frames = 0; frameAcc = 0;
  }
  if (now - hudTick > 250) {
    hudTick = now;
    rdDist.textContent = `${(dist / 1000).toFixed(3)} / ${(LOOP_LEN / 1000).toFixed(3)} km`;
    rdElev.textContent = `elev ${Math.round(40 + camera.position.y)} m`;
    prog.style.width = `${(dist / LOOP_LEN * 100).toFixed(2)}%`;
  }
  requestAnimationFrame(tick);
}

setTimeout(() => {
  build();
  patchAtmo(scene);
  resize();
  dist = LOOP_LEN * 0.08;
  const q = new URLSearchParams(location.search);
  if (q.has('d')) dist = (+q.get('d') % LOOP_LEN + LOOP_LEN) % LOOP_LEN;
  if (q.has('paused')) setPlaying(false);
  if (q.has('vg')) { compPass.uniforms.uVolGain.value = brightPass.uniforms.uVolGain.value = +q.get('vg'); }
  let savedFog = 21;                  // default fog 21%
  try { const v = localStorage.getItem('redwood-fog'); if (v !== null && !isNaN(+v)) savedFog = +v; } catch (e) { /* storage unavailable */ }
  setFog(q.has('fog') ? +q.get('fog') : savedFog);
  let savedTime = 171;                // default time 02:51
  try { const v = localStorage.getItem('redwood-time'); if (v !== null && !isNaN(+v)) savedTime = +v; } catch (e) { /* storage unavailable */ }
  applyTime(q.has('time') ? clamp(Math.round(+q.get('time') * 60), 0, 1439) : savedTime);
  if (q.has('ex')) compPass.uniforms.uExposure.value = +q.get('ex');
  if (q.has('pet')) setCompanion(q.get('pet') === 'jay' ? 'jay' : 'cat');
  loadingEl.classList.add('done');
  wake();
  last = performance.now(); tick(last);
}, 30);
</script>
